[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}, {access = "read-write", path = "./deployments"}]
libs = ["lib"]
optimizer = true
# Lowest runs: the contracts must stay under the 24,576-byte limit (EIP-170) to deploy on mainnet chains.
optimizer_runs = 1
out = "out"
solc_version = "0.8.30"
src = "src"
via_ir = true
# Each call from a test is its own transaction, as on-chain.
isolate = true
# Unichain-like gas prices (0.0005 gwei base fee, 0.0015 gwei gas price), so keeper and fill pay are non-zero.
block_base_fee_per_gas = 500000
gas_price = 1500000

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false
