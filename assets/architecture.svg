<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a72ad"/></marker>
<filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#8b5cf6" flood-opacity="0.45"/></filter>
<radialGradient id="halo"><stop offset="0" stop-color="#6d4fd8" stop-opacity="0.22"/><stop offset="1" stop-color="#6d4fd8" stop-opacity="0"/></radialGradient>
</defs><rect width="1600" height="1000" fill="#0b0a14"/><ellipse cx="1000" cy="120" rx="700" ry="260" fill="url(#halo)"/><text x="40" y="66" font-size="34" font-weight="750" fill="#eeebf8" letter-spacing="1">Alucard <tspan fill="#9d97b8" font-weight="400">· architecture</tspan></text><text x="40" y="98" font-size="16" fill="#9d97b8">Your own strategy, running on your Uniswap v4 liquidity. Live on Ethereum Sepolia and Unichain Sepolia.</text><rect x="30" y="140" width="270" height="740" rx="20" fill="#12101e" stroke="#2a2542"/><text x="54" y="174" font-size="13" font-weight="700" letter-spacing="2" fill="#a78bfa">PEOPLE</text><rect x="50" y="190" width="230" height="110" rx="14" fill="#1a1729" stroke="#36304f"/><text x="70" y="222" font-size="17" font-weight="650" fill="#eeebf8">LP (owner)</text><text x="70" y="246" font-size="13" fill="#9d97b8">builds a strategy,</text><text x="70" y="266" font-size="13" fill="#9d97b8">replays it, saves it</text><rect x="50" y="544" width="230" height="88" rx="14" fill="#1a1729" stroke="#36304f"/><text x="70" y="576" font-size="17" font-weight="650" fill="#eeebf8">Keeper (anyone)</text><text x="70" y="600" font-size="13" fill="#9d97b8">runs steps when ready,</text><text x="70" y="620" font-size="13" fill="#9d97b8">earns the owner's fee</text><rect x="50" y="774" width="230" height="88" rx="14" fill="#1a1729" stroke="#36304f"/><text x="70" y="806" font-size="17" font-weight="650" fill="#eeebf8">Swapper</text><text x="70" y="830" font-size="13" fill="#9d97b8">trades in the pools,</text><text x="70" y="850" font-size="13" fill="#9d97b8">fills limit orders</text><rect x="330" y="140" width="420" height="740" rx="20" fill="#12101e" stroke="#2a2542"/><text x="354" y="174" font-size="13" font-weight="700" letter-spacing="2" fill="#a78bfa">APP</text><text x="726" y="174" font-size="12" fill="#9d97b8" text-anchor="end">Next.js · wagmi</text><rect x="355" y="190" width="370" height="92" rx="14" fill="#1a1729" stroke="#36304f"/><text x="375" y="222" font-size="17" font-weight="650" fill="#eeebf8">Strategy builder</text><text x="375" y="246" font-size="13" fill="#9d97b8">steps on a canvas · templates</text><text x="375" y="266" font-size="13" fill="#9d97b8">refuses what the contract refuses</text><rect x="355" y="298" width="370" height="92" rx="14" fill="#1a1729" stroke="#36304f"/><text x="375" y="330" font-size="17" font-weight="650" fill="#eeebf8">Ask Alucard</text><text x="375" y="354" font-size="13" fill="#9d97b8">/api/assistant → Gemini</text><text x="375" y="374" font-size="13" fill="#9d97b8">answer checked like a hand build</text><rect x="355" y="406" width="370" height="92" rx="14" fill="#1a1729" stroke="#36304f"/><text x="375" y="438" font-size="17" font-weight="650" fill="#eeebf8">Backtest</text><text x="375" y="462" font-size="13" fill="#9d97b8">Python engine · real mainnet swaps</text><text x="375" y="482" font-size="13" fill="#9d97b8">of the same pair · ~0.2 s for 1M swaps</text><text x="355" y="530" font-size="12" font-weight="700" letter-spacing="2" fill="#a78bfa">BOTS · ANYONE CAN RUN THEM</text><rect x="355" y="544" width="370" height="88" rx="14" fill="#1a1729" stroke="#36304f"/><text x="375" y="576" font-size="17" font-weight="650" fill="#eeebf8">keeper.ts</text><text x="375" y="600" font-size="13" fill="#9d97b8">poke holds · execute steps that are ready</text><rect x="355" y="644" width="370" height="88" rx="14" fill="#1a1729" stroke="#36304f"/><text x="375" y="676" font-size="17" font-weight="650" fill="#eeebf8">arb.ts</text><text x="375" y="700" font-size="13" fill="#9d97b8">testnet only: keeps pools on Chainlink</text><text x="355" y="762" font-size="12" font-weight="700" letter-spacing="2" fill="#a78bfa">TRADING</text><rect x="355" y="774" width="370" height="88" rx="14" fill="#1a1729" stroke="#36304f"/><text x="375" y="806" font-size="17" font-weight="650" fill="#eeebf8">Swap · limit orders · positions</text><text x="375" y="830" font-size="13" fill="#9d97b8">quotes from Uniswap's V4Quoter</text><rect x="780" y="140" width="420" height="740" rx="20" fill="#12101e" stroke="#2a2542"/><text x="804" y="174" font-size="13" font-weight="700" letter-spacing="2" fill="#a78bfa">ALUCARD CONTRACTS</text><text x="1176" y="174" font-size="12" fill="#9d97b8" text-anchor="end">Solidity · 138 tests</text><rect x="805" y="190" width="370" height="124" rx="14" fill="#211b40" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/><text x="825" y="222" font-size="17" font-weight="650" fill="#eeebf8">ConditionalOrders</text><text x="825" y="246" font-size="13" fill="#9d97b8">the vault: holds positions with a strategy</text><text x="825" y="266" font-size="13" fill="#9d97b8">create · update · execute · poke · cancel</text><text x="825" y="286" font-size="13" fill="#9d97b8">keeper fee ≤ 1% · cancel always works</text><rect x="805" y="354" width="370" height="100" rx="14" fill="#1a1729" stroke="#36304f"/><text x="825" y="386" font-size="17" font-weight="650" fill="#eeebf8">Rules</text><text x="825" y="410" font-size="13" fill="#9d97b8">pool table · conditions · checkSide / checkLegs</text><text x="825" y="430" font-size="13" fill="#9d97b8">checkPrice: within ~2% of Chainlink</text><rect x="805" y="494" width="370" height="100" rx="14" fill="#1a1729" stroke="#36304f"/><text x="825" y="526" font-size="17" font-weight="650" fill="#eeebf8">PriceFeeds</text><text x="825" y="550" font-size="13" fill="#9d97b8">one Chainlink feed per token</text><text x="825" y="570" font-size="13" fill="#9d97b8">changes wait 2 days</text><rect x="805" y="664" width="370" height="124" rx="14" fill="#211b40" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/><text x="825" y="696" font-size="17" font-weight="650" fill="#eeebf8">RuleHook</text><text x="825" y="720" font-size="13" fill="#9d97b8">Uniswap v4 hook: beforeSwap · afterSwap</text><text x="825" y="740" font-size="13" fill="#9d97b8">limit orders filled inside the swap</text><text x="825" y="760" font-size="13" fill="#9d97b8">at the exact price, no keeper</text><rect x="1260" y="140" width="310" height="280" rx="20" fill="#12101e" stroke="#2a2542"/><text x="1284" y="174" font-size="13" font-weight="700" letter-spacing="2" fill="#a78bfa">UNISWAP V4 CORE</text><rect x="1280" y="190" width="270" height="110" rx="14" fill="#1a1729" stroke="#36304f"/><text x="1300" y="222" font-size="17" font-weight="650" fill="#eeebf8">PoolManager</text><text x="1300" y="246" font-size="13" fill="#9d97b8">every pool's liquidity and swaps;</text><text x="1300" y="266" font-size="13" fill="#9d97b8">the money stays here</text><rect x="1280" y="316" width="270" height="84" rx="14" fill="#1a1729" stroke="#36304f"/><text x="1300" y="348" font-size="17" font-weight="650" fill="#eeebf8">PositionManager</text><text x="1300" y="372" font-size="13" fill="#9d97b8">LP positions</text><rect x="1260" y="444" width="310" height="196" rx="20" fill="#12101e" stroke="#2a2542"/><text x="1284" y="478" font-size="13" font-weight="700" letter-spacing="2" fill="#a78bfa">CHAINLINK</text><rect x="1280" y="494" width="270" height="120" rx="14" fill="#1a1729" stroke="#36304f"/><text x="1300" y="526" font-size="17" font-weight="650" fill="#eeebf8">Price feeds</text><text x="1300" y="550" font-size="13" fill="#9d97b8">ETH · BTC · LINK · USDC · USDT · DAI</text><text x="1300" y="570" font-size="13" fill="#9d97b8">the price every pool</text><text x="1300" y="590" font-size="13" fill="#9d97b8">is checked against</text><rect x="1260" y="664" width="310" height="216" rx="20" fill="#12101e" stroke="#2a2542"/><text x="1284" y="698" font-size="13" font-weight="700" letter-spacing="2" fill="#a78bfa">UNISWAP PERIPHERY</text><rect x="1280" y="714" width="270" height="110" rx="14" fill="#1a1729" stroke="#36304f"/><text x="1300" y="746" font-size="17" font-weight="650" fill="#eeebf8">Router · Quoter</text><text x="1300" y="770" font-size="13" fill="#9d97b8">swaps and quotes</text><path d="M280 236 L 353 236" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="318" y="228" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="middle" stroke="#0b0a14" stroke-width="5" paint-order="stroke">signs</text><path d="M280 270 C 322 270, 318 344, 353 344" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="318" y="318" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="middle" stroke="#12101e" stroke-width="5" paint-order="stroke">describes</text><path d="M280 588 L 353 588" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="318" y="580" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="middle" stroke="#0b0a14" stroke-width="5" paint-order="stroke">runs</text><path d="M280 818 L 353 818" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="318" y="810" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="middle" stroke="#0b0a14" stroke-width="5" paint-order="stroke">trades</text><path d="M725 236 L 803 236" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="764" y="228" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="middle" stroke="#0b0a14" stroke-width="5" paint-order="stroke">createOrder</text><path d="M725 588 C 768 588, 762 290, 803 290" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="757" y="440" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="middle" stroke="#0b0a14" stroke-width="5" paint-order="stroke" transform="rotate(-90 757 440)">poke · execute</text><path d="M725 818 C 760 818, 760 905, 800 905 L 1380 905 C 1415 905, 1415 890, 1415 826" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="1000" y="909" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="middle" stroke="#0b0a14" stroke-width="5" paint-order="stroke">swap</text><path d="M1175 240 L 1278 240" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="1227" y="232" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="middle" stroke="#0b0a14" stroke-width="5" paint-order="stroke">modifyLiquidity · swap</text><path d="M990 314 L 990 352" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="1004" y="338" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="start" stroke="#12101e" stroke-width="5" paint-order="stroke">asks</text><path d="M990 454 L 990 492" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="1004" y="478" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="start" stroke="#12101e" stroke-width="5" paint-order="stroke">reads</text><path d="M1175 544 L 1278 544" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="1222" y="562" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="end" stroke="#0b0a14" stroke-width="5" paint-order="stroke">price</text><path d="M1280 285 C 1230 285, 1230 726, 1177 726" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="1240" y="640" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="middle" stroke="#0b0a14" stroke-width="5" paint-order="stroke" transform="rotate(-90 1240 640)">beforeSwap · afterSwap</text><path d="M1550 760 C 1590 760, 1590 760, 1590 600 L 1590 300 C 1590 250, 1580 250, 1552 250" fill="none" stroke="#7a72ad" stroke-width="2" marker-end="url(#arr)"/><text x="1584" y="500" font-size="12.5" font-weight="500" fill="#c9c3e6" text-anchor="middle" stroke="#0b0a14" stroke-width="5" paint-order="stroke" transform="rotate(-90 1584 500)">swap</text><text x="40" y="962" font-size="14" fill="#9d97b8">The money stays in Uniswap v4 until the owner withdraws. A pool’s price counts only while it is within ~2% of Chainlink, so a pushed price cannot fire a step.</text></svg>